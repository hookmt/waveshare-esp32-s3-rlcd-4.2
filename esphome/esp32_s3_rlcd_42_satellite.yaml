    id: font_small
    size: 18
    glyphs: " !\"%'()+=,-_.:;?<>*Â°/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄ„Ä†ÄĹĹĂ“ĹšĹąĹ»Ä…Ä‡Ä™Ĺ‚Ĺ„ĂłĹ›ĹşĹĽâ€”â€“"
  - file: "gfonts://Roboto"
    id: font_med
    size: 30
    glyphs: " !\"%'()+=,-_.:;?<>*Â°/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄ„Ä†ÄĹĹĂ“ĹšĹąĹ»Ä…Ä‡Ä™Ĺ‚Ĺ„ĂłĹ›ĹşĹĽ"
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 56
    glyphs: " !\"%'()+=,-_.:;?<>*Â°/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄ„Ä†ÄĹĹĂ“ĹšĹąĹ»Ä…Ä‡Ä™Ĺ‚Ĺ„ĂłĹ›ĹşĹĽ"
