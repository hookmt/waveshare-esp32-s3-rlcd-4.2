# =============================================================
# Waveshare ESP32-S3-RLCD-4.2  |  satelita VA + ekran RLCD
# Zrodlo bazowe: https://devices.esphome.io/devices/waveshare-esp32-s3-rlcd-42/
# Wersja 4 (2026-07-23): redesign ekranu - zegar "przekladany" w negatywie,
#   dzien+data obok siebie, temp/wilg z ikonami, WiFi wg sily, status HAOS.
# Wersja 8 Studio (2026-08-31): piksel 3 respektuje profil jasnosci dzien/noc.
# Wersja 9 Studio (2026-09-06): zewnetrzny announcement z HA zwalnia wspolne I2S,
#   a po zakonczeniu bezpiecznie przywraca lokalne wykrywanie wake word.
# Faza 1: glosnik pokladowy. Faza 2: PCM5102A -> Speaker Enable ALWAYS_OFF.
# TEST v1, 2026-09-19: po zatrzymaniu MWW odczekaj 200 ms przed przejeciem
# TEST v2, 2026-09-20: sterowanie przyciskami, piksel 2 = minutnik/budzik,
#   piksel 3 = stan infrastruktury.
# Wersja 10 (2026-09-30):
#   - Naprawa I2S: asynchroniczny bufor dzwonka wybudzenia - sekwencyjny
#     delay 150ms + podwojny wait_until (speaker + media_player) + 80ms pauzy
#     przed voice_assistant.start. Czyste I2S bez kolizji i obcinania chime.
#   - Czcionki: dodano obslugi glifow pauz (em dash \u2014 oraz en dash \u2013)
#     pod odpowiedzi LLM, usunieto duplikaty znakow.
#   - Ekran RLCD: przyspieszenie magistrali SPI z 1MHz do 4MHz (4x szybszy transfer
#     bufora 15KB) oraz update_interval: never (odswiezanie wylacznie zdarzeniowe
#     co pelna minute oraz przy zdarzeniach HA/VA, likwidacja narzutu CPU).
#   - Formatowanie LLM: sanityzacja nowej linii (\n, \r -> spacja) w lambdzie tekstu.
# =============================================================

# ==============================================================================
# Waveshare ESP32-S3-RLCD-4.2 - Production Voice Assistant Satellite
# Hardware: Waveshare ESP32-S3-RLCD-4.2 (ST7305 RLCD, ES7210 AEC, ES8311, SHTC3)
# Status LEDs: 4x WS2812 Addressable RGB Strip (GPIO1)
# Enclosure: Custom 3D-printed case (enclosure/)
# Author: hookmt (https://github.com/hookmt)
# ==============================================================================

substitutions:
  name: "va-rlcd-01"
  friendly_name: "Voice Satellite RLCD"
  room: "living_room"
  # Home Assistant weather entity (e.g. weather.home, weather.dom, weather.forecast_home)
  weather_entity: "weather.dom"
  # Home Assistant status entities (customize to your setup or leave defaults)
  home_state_entity: "sensor.stan_domu"
  infrastructure_state_entity: "sensor.stan_infrastruktury"
  door_state_entity: "sensor.stan_drzwi"
  timer_entity: "timer.minutnik"
  timer_room_entity: "input_text.minutnik_pokoj"
  alarm_entity: "input_datetime.budzik"
  alarm_room_entity: "input_text.budzik_pokoj"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  on_boot:
    # Zapal pasek statusowy z efektem animowanym (4 piksele).
    - light.turn_on:
        id: status_leds
        brightness: 100%
        effect: "Status"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    components:
      - espressif/esp-nn==1.1.2

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lambda: id(wifi_ok) = true;
    - component.update: my_display
  on_disconnect:
    - lambda: id(wifi_ok) = false;

api:
  # Akcja dla automatyzacji HA. Zmienia tylko mnozniki profilu, nie nastawy
  # czterech suwakow jasnosci. Dzieki temu dzien/noc, obecnosc i oswietlenie
  # moga zmieniac profil bez flashowania ani nadpisywania strojenia uzytkownika.
  actions:
    - action: set_pixel_profile
      variables:
        home_ok_scale: float
        home_alert_scale: float
        va_scale: float
        door_scale: float
        reserve_scale: float
      then:
        - lambda: |-
            id(pixel_home_ok_scale) = home_ok_scale;
            id(pixel_home_alert_scale) = home_alert_scale;
            id(pixel_va_scale) = va_scale;
            id(pixel_door_scale) = door_scale;
            id(pixel_reserve_scale) = reserve_scale;
  on_client_connected:
    - lambda: id(ha_ok) = true;
    - component.update: my_display
  on_client_disconnected:
    - lambda: id(ha_ok) = false;
    - component.update: my_display

ota:
  - platform: esphome

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]

# Czas z Home Assistanta (do zegara na ekranie)
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # snap minuty o pelnej minucie (jeden tani render, bez animacji)
      - seconds: 0
        then:
          - component.update: my_display

# Znaczniki stanu uzywane przez ekran
globals:
  - id: va_state          # 0 czuwa, 1 slucham, 2 mysle, 3 mowie
    type: int
    restore_value: false
    initial_value: '0'
  - id: wifi_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ha_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_stt           # co uslyszalo
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_reply         # co odpowiedzialo (lub kod bledu)
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: show_reply         # czy pokazywac tekst zamiast zegara
    type: bool
    restore_value: false
    initial_value: 'false'
  # Mnozniki profilu, ustawiane z HA przez api.set_pixel_profile.
  # Kazdy jest niezalezny od stalej, recznej jasnosci danego piksela.
  - id: pixel_home_ok_scale
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: pixel_home_alert_scale
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: pixel_va_scale
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: pixel_door_scale
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: pixel_reserve_scale
    type: float
    restore_value: true
    initial_value: '1.0'

# ---------- I2C: SHTC3 + ES8311 + ES7210 ----------
i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a

# ---------- Czcionki ----------
